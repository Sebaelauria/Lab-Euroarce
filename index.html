<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi App</title><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#16a34a"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Mi App"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#fff;--sf:#fff;--tx:#0f1f17;--mu:#6b7d73;--bd:#e1ece5;--ac:#16a34a;--M:#f59e0b;--T:#0ea5e9;--N:#6366f1;--L:#10b981;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,sans-serif;display:flex;flex-direction:column}
main{flex:1;overflow-y:auto;padding:16px 16px 24px}
h1{font-size:22px;margin:0 0 12px}h2{font-size:15px;margin:18px 0 8px;color:var(--mu);font-weight:600}
nav{display:flex;border-top:1px solid var(--bd);background:var(--sf)}
nav button{flex:1;border:0;background:none;color:var(--mu);padding:12px 0;font:600 13px system-ui;display:flex;flex-direction:column;gap:2px;align-items:center}
nav button.on{color:var(--ac)}nav span{font-size:20px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:10px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
button.b{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:11px 14px;font:600 15px system-ui}
button.g{background:none;border:1px solid var(--bd);color:var(--tx);border-radius:10px;padding:9px 12px;font:600 14px system-ui}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dh{font-size:11px;color:var(--mu);text-align:center;padding:2px 0}
.d{aspect-ratio:1/1.1;border-radius:10px;background:var(--sf);border:1px solid var(--bd);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:4px 0;font-size:14px;color:var(--tx)}
.d.today{outline:2px solid var(--ac)}.d.e{visibility:hidden}
.s{width:70%;height:6px;border-radius:3px;background:transparent}.ev{font-size:9px;color:var(--mu)}
.leg{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--mu);margin:10px 0}
.dot{display:inline-block;width:10px;height:10px;border-radius:5px;margin-right:4px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.opts button{padding:12px;border-radius:10px;border:2px solid var(--bd);background:var(--sf);color:var(--tx);font:600 15px system-ui}
.opts button.on{border-color:var(--ac)}
label{display:block;font-size:13px;color:var(--mu);margin-bottom:10px}
input,textarea{width:100%;font:17px system-ui;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);margin-top:4px}
.res{font-size:30px;font-weight:700;color:var(--ac);margin:6px 0}
.f{font-size:12px;color:var(--mu)}
.back{background:none;border:0;color:var(--ac);font:600 15px system-ui;padding:0 0 10px}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;z-index:5}
.sheet>div{background:var(--sf);width:100%;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.sec{font-size:22px;font-weight:700;margin:6px 0;color:#059669}@media (prefers-color-scheme:dark){.sec{color:#34d399}}
.h{border-top:1px solid var(--bd);padding:8px 0;font-size:14px}
#vf{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:29px;border:0;background:var(--ac);color:#fff;font-size:26px;box-shadow:0 4px 14px rgba(0,0,0,.3);z-index:6}
#vf.on{display:none}
#vp{display:none;position:fixed;left:12px;right:12px;top:calc(8px + env(safe-area-inset-top,0px));background:var(--sf);color:var(--tx);border:1px solid var(--bd);border-radius:18px;padding:12px;z-index:7;box-shadow:0 8px 30px rgba(0,0,0,.35);text-align:center}
#vo{width:56px;height:56px;border-radius:50%;margin:0 auto 6px;background:var(--mu)}
.v-listening #vo{background:#10b981;animation:vl 1.2s ease-out infinite}
.v-thinking #vo{background:var(--ac);border-radius:30%;animation:vt 1s linear infinite}
.v-speaking #vo{background:#6366f1;animation:vs .5s ease-in-out infinite alternate}
@keyframes vl{0%{box-shadow:0 0 0 0 rgba(16,185,129,.6)}100%{box-shadow:0 0 0 26px rgba(16,185,129,0)}}
@keyframes vt{to{transform:rotate(360deg)}}
@keyframes vs{from{transform:scale(.85)}to{transform:scale(1.15)}}
#vs{font-weight:600;font-size:14px}#vt{color:var(--mu);font-size:14px;min-height:18px;margin-top:2px}#vr{font-size:15px;margin:4px 0 8px;min-height:18px}
#vx{background:#dc2626;color:#fff;border:0;border-radius:10px;padding:9px 18px;font:600 15px system-ui}
.gv{font-size:22px;font-weight:700;color:var(--ac)}
#vp{position:static;flex:none;border:0;border-top:1px solid var(--bd);border-radius:0;box-shadow:none;padding:8px 12px;grid-template-columns:40px 1fr auto;column-gap:10px;align-items:center;text-align:left}
#vo{width:34px;height:34px;margin:0;grid-row:1/4;grid-column:1}
#vs,#vt,#vr{grid-column:2;margin:0;min-height:0}
#vs{font-size:12px;color:var(--mu)}#vt{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#vr{font-size:14px;font-weight:600;max-height:2.8em;overflow:hidden}
#vx{grid-column:3;grid-row:1/4;padding:8px 12px;font-size:14px}
@keyframes vl{0%{box-shadow:0 0 0 0 rgba(16,185,129,.6)}100%{box-shadow:0 0 0 12px rgba(16,185,129,0)}}
.mg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mc{display:flex;flex-direction:column;justify-content:space-between;gap:10px;aspect-ratio:1/1;padding:16px;border:1px solid var(--bd);border-radius:22px;background:var(--sf);color:var(--tx);text-align:left;box-shadow:0 1px 3px rgba(22,101,52,.07)}
.mc:active{background:#f0fdf4;border-color:var(--ac)}
.mc i{width:46px;height:46px;border-radius:15px;background:#ecfdf3;display:grid;place-items:center;font-style:normal;font-size:23px}
.mc b{font:600 15px/1.25 system-ui}.mc .f{color:var(--ac);font-weight:600}
h1{letter-spacing:-.3px}
</style></head><body>
<main id="m"></main>
<nav><button id="t-med" onclick="go('med')"><span>🧪</span>Mediciones</button><button id="t-cal" onclick="go('cal')"><span>📅</span>Calendario</button></nav>
<script>
const SH={M:['Mañana','var(--M)'],T:['Tarde','var(--T)'],N:['Noche','var(--N)'],L:['Libre','var(--L)']};
function st4(v){const a=[v.a1,v.a2,v.a3,v.a4].filter(isFinite),n=a.length;if(!n)return NaN;const m=a.reduce((p,c)=>p+c)/n,sd=n>1?Math.sqrt(a.reduce((p,c)=>p+(c-m)*(c-m),0)/(n-1)):NaN;return{r:m,ex:['Desv. std: '+fmt(sd,2),n+' piezas']}}
const T=[432.7,360.3,393.5,329.3,336.1,303.7,306.2,312.2,355.8],MA=['>1000','1000-630','630-500','500-400','400-300','300-200','200-100','100-75','<75'];
const avg=a=>{a=a.filter(x=>isFinite(x));return a.length?a.reduce((p,c)=>p+c)/a.length:NaN};
const CALCS=[
{id:'dar',n:'Densidad aparente – Redondas',u:'g/cc',dec:3,f:[['m','Masa (g)'],['d','Diámetro (mm)'],['h1','Altura med. 1 (mm)'],['h2','Altura med. 2 (mm)'],['h3','Altura med. 3 (mm)'],['h4','Altura med. 4 (mm)'],['H','Humedad (%)']],fo:'Vol = π·d²/4·h̄ · Dap = m / Vol · Dap seco = Dap / (1 + H/100)',c:v=>{const h=avg([v.h1,v.h2,v.h3,v.h4]),V=Math.PI*v.d*v.d/4*h/1000,D=v.m/V;return{r:D,ex:['Altura promedio: '+fmt(h)+' mm','Volumen: '+fmt(V,3)+' cc'].concat(isFinite(v.H)?['D. aparente seco: '+fmt(D/(1+v.H/100),3)+' g/cc']:[])}}},
{id:'dre',n:'Densidad aparente – Rectangulares',u:'g/cc',dec:3,f:[['m','Masa (g)'],['l','Lado corto (mm)'],['a','Lado largo (mm)'],['h1','Altura med. 1 (mm)'],['h2','Altura med. 2 (mm)'],['h3','Altura med. 3 (mm)'],['h4','Altura med. 4 (mm)'],['H','Humedad (%)']],fo:'Vol = corto·largo·h̄ · Dap = m / Vol · Dap seco = Dap / (1 + H/100)',c:v=>{const h=avg([v.h1,v.h2,v.h3,v.h4]),V=v.l*v.a*h/1000,D=v.m/V;return{r:D,ex:['Altura promedio: '+fmt(h)+' mm','Volumen: '+fmt(V,3)+' cc'].concat(isFinite(v.H)?['D. aparente seco: '+fmt(D/(1+v.H/100),3)+' g/cc']:[])}}},
{id:'abs',n:'Absorción de agua',u:'% (media)',dec:2,tbl:['Pi (g)','Pf (g)'],f:[],fo:'a.a = (Pf − Pi) / Pi · 100',rf:(a,b)=>(b-a)/a*100,c:()=>tsum()},
{id:'gra',n:'Granulometría',u:'% retenido total',seq:1,f:[['M','Muestra (g)',200,1]].concat(MA.map((m,i)=>['t'+i,'Tamiz + muestra '+m+' µm (g)'])),fo:'% malla = (Tamiz+g − Tara tamiz) / Muestra · 100',c:v=>{const M=v.M||200;let s=0;const ex=[],rows=MA.map((m,i)=>{const p=(v['t'+i]-T[i])/M*100;if(isFinite(p)){s+=p;ex.push(m+': '+fmt(p,2)+' %')}return[m,p,i]});return{r:ex.length?s:NaN,ex:ex.length?ex.concat(['Finos/pérdida: '+fmt(100-s,2)+' %']):[],rows}}},
{id:'mec',n:'Resistencia mecánica',u:'',duo:1,f:[],fo:'',c:()=>duSum()},
{id:'con',n:'Contracción lineal',u:'% (media)',dec:2,tbl:['D. inicial (mm)','D. final (mm)'],f:[],fo:'CL = (Di − Df) / Di · 100',rf:(a,b)=>(a-b)/a*100,c:()=>tsum()},
{id:'rec',n:'Rechazo de barbotina',u:'% rechazo',dec:2,f:[['d','Densidad (g/cc)'],['pr','Peso rechazo (g)']],fo:'Gr. barbotina = ρ·100 · %CS = 156,33 − 154,6/ρ · Gr. secos = Gr. barbotina · %CS / 100 · Corrector = Gr. secos / 100 · %Rechazo = rechazo / Gr. secos · 100',c:v=>{if(!isFinite(v.d))return NaN;const g=v.d*100,cs=156.33-154.6/v.d,gs=g*cs/100;return{r:v.pr/gs*100,ex:['Volumen barbotina: 100 mL','Gramos barbotina: '+fmt(g,1)+' g','% C.S: '+fmt(cs,1)+' %','Gramos secos: '+fmt(gs,2)+' g','Corrector: '+fmt(gs/100,3)]}}},
{id:'ata',n:'Densidad atomizado',u:'g/cc',dec:3,f:[['a','Peso LBG (g)'],['b','Peso atomizado + LBG (g)'],['V','Volumen (cc)',500]],fo:'Dap = (Peso atom+LBG − Peso LBG) / V',c:v=>(v.b-v.a)/v.V},
{id:'hum',n:'Humedad (agua a agregar)',u:'ml',f:[['hi','% Humedad inicial'],['hf','% Humedad final'],['p','Peso inicial atomizado (g)']],fo:'Agua = Peso inicial · (%Hf − %Hi) / 100',c:v=>{const a=v.p*(v.hf-v.hi)/100;return{r:a,ex:['Peso final atomizado: '+fmt(v.p+a)+' g']}}}
];
let MSG='',S={days:{},ev:{},hist:{}},tab='med',cur=new Date(),calc=null;
try{S=Object.assign(S,JSON.parse(localStorage.getItem('app')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('app',JSON.stringify(S))}catch(e){}};
const fmt=(n,d)=>isFinite(n)?(d?n.toFixed(d):(Math.round(n*1000)/1000).toString()).replace('.',','):'—';
const key=(y,m,d)=>y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
function go(t){if(t!==tab)history.pushState({tab:t,c:null},'');tab=t;calc=null;render()}
function back(){if(history.state&&history.state.c)history.back();else go('med')}
addEventListener('popstate',e=>{const q=e.state||{tab:'med',c:null};if(q.tab==='med'&&!q.c&&!calc&&tab==='med'){history.back();return}tab=q.tab||'med';calc=null;render()});
function render(){
 ['cal','med'].forEach(x=>document.getElementById('t-'+x).classList.toggle('on',x===tab));
 const m=document.getElementById('m');m.innerHTML=tab==='cal'?calHTML():(calc?calcHTML():medHTML());m.scrollTop=0;if(calc&&tab==='med')upd()}
function calHTML(){
 const y=cur.getFullYear(),mo=cur.getMonth(),first=(new Date(y,mo,1).getDay()+6)%7,n=new Date(y,mo+1,0).getDate(),td=new Date();
 const name=new Date(y,mo,1).toLocaleDateString('es',{month:'long',year:'numeric'});
 let g='';['L','M','X','J','V','S','D'].forEach(x=>g+='<div class="dh">'+x+'</div>');
 for(let i=0;i<first;i++)g+='<div class="d e"></div>';
 for(let d=1;d<=n;d++){const k=key(y,mo,d),s=S.days[k],ev=(S.ev[k]||[]).length,sc=(s&&s.s)||(S.sh||{})[k];
  g+=`<button class="d ${td.getFullYear()==y&&td.getMonth()==mo&&td.getDate()==d?'today':''}" style="${sc?'background:'+SH[sc][1]+';color:#fff;border-color:transparent':''}" onclick="editDay('${k}')"><b style="font-weight:600">${d}</b><span class="ev" style="color:inherit;font-size:10px">${sc?SH[sc][0]:'&nbsp;'}${s&&s.note?' ✎':''}</span></button>`}
 return `<h1>Calendario</h1><div class="row" style="margin-bottom:10px"><button class="g" onclick="mv(-1)">‹</button><b style="text-transform:capitalize">${name}</b><button class="g" onclick="mv(1)">›</button></div><div class="grid">${g}</div>
 <div class="leg">${Object.values(SH).map(v=>`<span><i class="dot" style="background:${v[1]}"></i>${v[0]}</span>`).join('')}</div>
 <div class="card"><b>Sincronizar con Shifter</b><p class="f" style="margin:6px 0 10px">En Shifter exportá tu calendario como archivo .ics y cargalo acá. Los turnos aparecen como eventos en cada día.</p><div class="row"><label style="display:inline-block;margin:0;position:relative;overflow:hidden;background:var(--ac);color:#fff;border-radius:10px;padding:11px 14px;font:600 15px system-ui">Importar .ics<input type="file" id="ics" onchange="imp(this)" style="position:absolute;inset:0;width:100%;height:100%;opacity:0;margin:0;padding:0;border:0"></label><button class="g" onclick="S.ev={};S.sh={};MSG='';save();render()">Borrar importados</button></div><div class="f" style="margin-top:8px">${MSG}</div></div>`}
function mv(i){cur=new Date(cur.getFullYear(),cur.getMonth()+i,1);render()}
function shiftOf(s,h){const t=s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
 if(/libre|descanso|off|franco|vacac|rest/.test(t))return'L';
 if(/noche|night|nocturn|\bn\b/.test(t))return'N';
 if(/tarde|afternoon|vespert|\bt\b/.test(t))return'T';
 if(/manana|morning|matutin|early|\bm\b/.test(t))return'M';
 if(h!==undefined&&h!==''){h=+h;return h>=5&&h<12?'M':h>=12&&h<20?'T':'N'}
 return null}
function imp(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{
 const t=r.result.replace(/\r?\n[ \t]/g,'');let c=0;const NI=new Set();
 t.split('BEGIN:VEVENT').slice(1).forEach(b=>{const d=(b.match(/DTSTART[^:\n]*:(\d{4})(\d{2})(\d{2})(?:T(\d{2}))?/)||[]),s=(b.match(/SUMMARY[^:\n]*:(.*)/)||[])[1];
  if(d[1]&&s){const k=d[1]+'-'+d[2]+'-'+d[3],sc=shiftOf(s,d[4]);(S.ev[k]=S.ev[k]||[]).push(s.trim());if(sc){(S.sh=S.sh||{})[k]=sc;c++}else NI.add(s.trim())}});
 MSG=(c?c+' turnos identificados':'No identifiqué turnos')+(NI.size?'. Sin identificar: '+[...NI].slice(0,6).join(', '):'');save();render()};r.onerror=()=>{MSG='No pude leer el archivo';render()};r.readAsText(f)}
function editDay(k){const s=S.days[k]||{},ev=S.ev[k]||[];
 const o=document.createElement('div');o.className='sheet';o.onclick=e=>{if(e.target===o)o.remove()};
 o.innerHTML=`<div><b>${k.split('-').reverse().join('/')}</b>${ev.length?'<p class="f">Shifter: '+ev.join(' · ')+'</p>':''}<div class="opts">${Object.entries(SH).map(([c,v])=>`<button data-c="${c}" class="${s.s===c?'on':''}" style="border-left:8px solid ${v[1]}">${v[0]}</button>`).join('')}</div><label>Nota<textarea rows="2" id="nt">${s.note||''}</textarea></label><div class="row"><button class="g" id="cl">Limpiar</button><button class="b" id="ok">Guardar</button></div></div>`;
 document.body.appendChild(o);let sel=s.s;
 o.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{sel=b.dataset.c;o.querySelectorAll('[data-c]').forEach(x=>x.classList.toggle('on',x===b))});
 o.querySelector('#cl').onclick=()=>{delete S.days[k];save();o.remove();render()};
 o.querySelector('#ok').onclick=()=>{S.days[k]={s:sel,note:o.querySelector('#nt').value};save();o.remove();render()}}
function medHTML(){const IC={'dar': '⚪', 'dre': '⬜', 'abs': '💧', 'gra': '🔬', 'mec': '🔨', 'con': '📏', 'rec': '🧪', 'ata': '🌫️', 'hum': '💦'};return `<h1>Mediciones</h1><div class="mg">`+CALCS.map(c=>{const n=(S.hist[c.id]||[]).length;return `<button class="mc" onclick="open_('${c.id}')"><i>${IC[c.id]||'🧪'}</i><b>${c.n}</b><span class="f">${n} ${n===1?'registro':'registros'}</span></button>`}).join('')+`</div>`}
let TB=[],TC=0;const tbInit=()=>{TB=Array.from({length:20},()=>['','']);};
const pf=s=>parseFloat(String(s).replace(',','.'));
function tvals(){return TB.map(r=>calc.rf(pf(r[0]),pf(r[1])))}
function tsum(){const res=tvals().filter(isFinite),n=res.length;if(!n)return NaN;const m=res.reduce((a,b)=>a+b)/n,sd=n>1?Math.sqrt(res.reduce((a,b)=>a+(b-m)*(b-m),0)/(n-1)):NaN;return{r:m,ex:[]}}
function rowsUpd(){tvals().forEach((x,i)=>{const e=document.getElementById('r'+i);if(e)e.textContent=isFinite(x)?fmt(x,2)+' %':'—'})}
function tbs(i,j,v){TB[i][j]=v;upd()}
function tblHTML(){const h=S.hist[calc.id]||[];
 return `<button class="back" onclick="back()">‹ Mediciones</button><h1>${calc.n}</h1><div class="card"><div class="f">${calc.fo}</div><table style="width:100%;border-collapse:collapse;margin-top:8px"><tr class="f"><td>#</td><td>${calc.tbl[0]}</td><td>${calc.tbl[1]}</td><td style="text-align:right"><b>Resultado</b></td></tr>${TB.map((r,i)=>`<tr><td class="f">${i+1}</td><td><input inputmode="decimal" value="${r[0]}" oninput="tbs(${i},0,this.value)" style="margin:2px 4px 2px 0;padding:8px"></td><td><input inputmode="decimal" value="${r[1]}" oninput="tbs(${i},1,this.value)" style="margin:2px 4px 2px 0;padding:8px"></td><td id="r${i}" class="gv" style="text-align:right;white-space:nowrap">—</td></tr>`).join('')}</table><div class="row" style="margin:10px 0"><button class="g" onclick="TB.push(['','']);render()">+ Pieza</button><button class="g" onclick="tbInit();render()">Limpiar</button></div><div class="f" id="rs" style="display:none"></div><div class="f" id="ex"></div><div style="margin-top:10px"><button class="b" onclick="sv()">Guardar</button></div></div><h2>Historial</h2>${h.length?h.slice().reverse().slice(0,30).map(x=>hi(x)).join(''):'<p class="f">Sin registros todavía.</p>'}`}
let DU=[[],[]];const duInit=()=>{DU=[['','','',''],['','','','']]};
function stat(a){a=a.map(pf).filter(isFinite);const n=a.length;if(!n)return null;const m=a.reduce((p,c)=>p+c)/n;return{m,sd:n>1?Math.sqrt(a.reduce((p,c)=>p+(c-m)*(c-m),0)/(n-1)):NaN,n}}
function duSum(){const s=[stat(DU[0]),stat(DU[1])];if(!s[0]&&!s[1])return NaN;const L=(t,u,x)=>x?t+': media '+fmt(x.m,2)+' '+u+' · desv. std '+fmt(x.sd,2):null;return{r:(s[1]||s[0]).m,ex:[L('Fuerza','N',s[0]),L('R. mec','MPa',s[1])].filter(Boolean)}}
function duUpd(){if(calc&&calc.duo){(S.dr=S.dr||{})[calc.id]={DU:DU};save()}[0,1].forEach(g=>{const x=stat(DU[g]),e=document.getElementById('du'+g);if(e)e.innerHTML=x?'<b>Media: '+fmt(x.m,2)+'</b><br>Desv. std: '+fmt(x.sd,2):'—'})}
function dus(g,i,v){DU[g][i]=v;duUpd()}
function duoHTML(){const h=S.hist[calc.id]||[],col=(g,t)=>`<div><b>${t}</b>${[0,1,2,3].map(i=>`<input inputmode="decimal" placeholder="Pieza ${i+1}" value="${DU[g][i]}" oninput="dus(${g},${i},this.value)">`).join('')}<div class="res" style="font-size:20px" id="du${g}">—</div></div>`;

 const i=pm?+pm[1]-1:DU[g].findIndex(x=>x==='');
 if(i<0||i>3){say(pm?'Las piezas van de 1 a 4.':'No quedan huecos libres, usá "pieza" y el número para cambiar uno.');return}
 const old=DU[g][i],id=calc.id;UN.push(()=>{if(calc&&calc.id===id){DU[g][i]=old;const e=inp('#m input')[g*4+i];if(e)e.value=old;duUpd()}});
 DU[g][i]=fmtN(v);const e=inp('#m input')[g*4+i];if(e)e.value=fmtN(v);
 duUpd();const all=DU[0].every(x=>x!=='')&&DU[1].every(x=>x!==''),ng=DU[g].findIndex(x=>x==='')>=0?g:1-g,ni=DU[ng].findIndex(x=>x==='');
 say(fmtN(v)+'. '+(all?'Datos completos. '+(resText()||''):'Siguiente: '+(ng?'R mec':'fuerza')+' pieza '+(ni+1)+'.'))}
function read(){const x=resText();say(tab!=='med'||!calc?'No hay ninguna medición abierta.':x||'Todavía faltan datos para calcular.')}
/* ---------- intérprete ---------- */
const NAV=[[/redond/,'dar'],[/rectang/,'dre'],[/absorc|\ba\.?a\b/,'abs'],[/granul/,'gra'],[/resisten|mecanic/,'mec'],[/contrac/,'con'],[/rechazo|barbotina/,'rec'],[/atomiz/,'ata'],[/humedad/,'hum']];
function handle(raw){setSt('thinking');$('vt').textContent=raw;const t=norm(raw),nums=(t.match(/\d+(?:#\d+)?/g)||[]).map(x=>x.replace('#','.'));
 if(pend){const p=pend;pend=null;if(/\b(si|dale|confirmo|ok|adelante|claro|seguro)\b/.test(t))p();else say('Cancelado.');return}
 if(/\b(terminar|termina|terminemos|chau|adios|desactivar|apagar|apaga|fin|basta)\b/.test(t)){say('Hasta luego.',off);return}
 if(!nums.length&&UN.length&&/\b(no|mal|error|me equivoque|corregi)\b/.test(t)){UN.pop()();say('Anulado. Decime de nuevo el dato.');return}
 if(!nums.length&&/\b(listo|termine|ya esta|eso es todo|ya termine)\b/.test(t)){if(tab==='med'&&calc&&calc.tbl&&TC===0&&TB.some(r=>r[0]!=='')){TC=1;const nr=nrow(1);if(nr>=0){say('Ahora '+tcn()+'. Pieza '+(nr+1)+'.');return}}read();return}
 if(/deshac|anterior|volve|atras/.test(t)&&!nums.length){const f=UN.pop();if(f){f();say('Listo, volví al valor anterior.')}else say('No hay nada que deshacer.');return}
 if(/repet/.test(t)){if(/calcul|resultado|cuenta/.test(t))read();else say(last||'Todavía no dije nada.');return}
 if(/explic|formula|como se calcula/.test(t)){if(tab!=='med'||!calc)say('Abrí primero una medición.');else say(calc.fo?'La fórmula es: '+spk(calc.fo)+'.':'No tengo la fórmula cargada para esta medición.');return}
 if(/guard/.test(t)){if(tab!=='med'||!calc){say('No hay ninguna medición abierta para guardar.');return}const h=(S.hist[calc.id]||[]).length;sv();say((S.hist[calc.id]||[]).length>h?'Guardado en el historial.':'No hay un resultado para guardar todavía.');return}
 if(/limpi|reinici|borra(r)? todo|empeza de nuevo/.test(t)){if(tab!=='med'||!calc){say('No hay nada abierto para limpiar.');return}
  pend=()=>{if(calc.tbl)tbInit();if(calc.duo)duInit();lf=null;render();say('Listo, limpié todo.')};say('¿Seguro que querés limpiar todos los datos de esta pantalla? Decí sí o no.');return}
 if(/\b(borra|borrar|elimina|quita|saca)\b/.test(t)){if(tab!=='med'||!calc||calc.tbl||calc.duo){say('Para tablas y grupos decí "limpiá todo". Para campos sueltos, abrí la medición y decime cuál borrar.');return}setStd(t,nums,true);return}
 if(!nums.length){
  if(/calendario|agenda/.test(t)){go('cal');say('Calendario.');return}
  if(/mediciones|menu|inicio/.test(t)&&!NAV.some(n=>n[0].test(t))){go('med');say('Mediciones.');return}
  const n=NAV.find(n=>n[0].test(t));
  if(n&&/\b(abri|abre|anda|ir|vamos|mostrame|ve|a|la|el)\b/.test(t)||n){if(!n){say('No encontré esa medición.');return}go('med');open_(n[1]);lf=null;say('Abrí '+calc.n+'. '+intro());return}
  if(/calcul|resultado|cuanto|decime|lee/.test(t)){read();return}
  if(tab==='med'&&calc&&!calc.tbl&&!calc.duo){const ws=t.split(/[^a-z]+/).filter(w=>w&&!STOP.test(w)),c=ws.length?ff(ws,[]):[];if(c.length===1){lf=c[0][0];say('¿Cuánto vale '+c[0][1].trim()+'?');return}}
  say('No te entendí. ¿Podés repetirlo?');return}
 if(tab!=='med'||!calc){const n=NAV.find(n=>n[0].test(t));if(n){go('med');open_(n[1]);lf=null;say('Abrí '+calc.n+'. '+intro());return}say('Primero decime qué medición querés abrir.');return}
 if(calc.tbl)fillT(t,nums);else if(calc.duo)fillD(t,nums);else setStd(t,nums,false)}
})();
